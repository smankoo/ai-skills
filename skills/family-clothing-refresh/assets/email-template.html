<!-- Shared email shell. Consistent across every person's email by construction.
     Placeholders (documented without braces so they are not themselves substituted):
     NAME, SUBTITLE, EYEBROW, SIZEBOX, SECTIONS, TOTAL, FOOTNOTE, FOOTER. -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f4f2ee;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f2ee;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:660px;background:#ffffff;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.08);">

  <!-- header -->
  <tr><td style="background:#1f3a34;padding:26px 30px;">
    <div style="color:#9ec4b8;font-size:11px;letter-spacing:2.2px;text-transform:uppercase;font-weight:600;">{{EYEBROW}}</div>
    <div style="color:#ffffff;font-size:27px;font-weight:700;margin-top:5px;letter-spacing:-.4px;">{{NAME}}</div>
    <div style="color:#9ec4b8;font-size:14px;margin-top:5px;">{{SUBTITLE}}</div>
  </td></tr>

  {{SIZEBOX}}

  <tr><td style="padding:4px 30px 8px;">{{SECTIONS}}</td></tr>

  <!-- total -->
  <tr><td style="padding:6px 30px 26px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#1f3a34;border-radius:10px;">
      <tr>
        <td style="padding:16px 20px;color:#9ec4b8;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;font-weight:600;">Estimated total</td>
        <td align="right" style="padding:16px 20px;color:#ffffff;font-size:23px;font-weight:700;">{{TOTAL}}</td>
      </tr>
    </table>
    <div style="color:#7a7268;font-size:12px;line-height:1.6;margin-top:12px;">{{FOOTNOTE}}</div>
  </td></tr>

  <tr><td style="background:#faf8f5;padding:16px 30px;border-top:1px solid #ece7e0;color:#9a9288;font-size:11px;line-height:1.6;">
    {{FOOTER}}
  </td></tr>

</table>
</td></tr></table>
</body></html>

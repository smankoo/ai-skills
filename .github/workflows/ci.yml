name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-ci:
    name: Shell Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          mapfile -t shell_files < <(find . -type f -name "*.sh" | sort)
          for file in "${shell_files[@]}"; do
            bash -n "$file"
          done

      - name: Shellcheck
        run: |
          mapfile -t shell_files < <(find . -type f -name "*.sh" | sort)
          shellcheck "${shell_files[@]}"

      - name: Python syntax check
        run: |
          mapfile -t py_files < <(find . -type f -name "*.py" | sort)
          for file in "${py_files[@]}"; do
            python3 -m py_compile "$file"
          done

      - name: No personal data in skills
        run: |
          set -euo pipefail
          # Skills carry method, not personal data, so they stay shareable. This catches the easy
          # regressions: a real name, a home path, an email address, or a credential left behind
          # after a run. Add to PATTERNS rather than weakening it.
          # A quoted secret counts only if the value is a real one — a "<placeholder>" does not.
          PATTERNS='/Users/[a-z]|/home/[a-z]|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|(password|token|secret|api_key)[[:space:]]*=[[:space:]]*"[^<"]|sk-[A-Za-z0-9]{16,}|sbp_[A-Za-z0-9]{16,}|xox[baprs]-'
          # example.com / example.org addresses are documentation placeholders, by RFC 2606.
          if grep -rIEn "$PATTERNS" skills/ | grep -vE '@(example\.(com|org|net)|b\.com|d\.com)'; then
            echo "::error::personal data or a credential found in skills/ — see matches above"
            exit 1
          fi
          echo "OK: no personal data in skills/"

      - name: Build emails from example cart
        run: |
          set -euo pipefail
          skill="skills/personal-shopper"
          out="$(mktemp -d)"
          python3 "$skill/scripts/build_emails.py" "$skill/examples"/*.json --out-dir "$out"
          test -f "$out/email-01-example.html"
          # A stray {{PLACEHOLDER}} must never survive into a built email.
          ! grep -q '{{' "$out/email-01-example.html"
          # The fixture has images in one section and none in the other, so this covers both
          # branches: thumbnails render, and the subtotal spans the thumbnail column only where
          # that column exists.
          test "$(grep -o '<img' "$out/email-01-example.html" | wc -l | tr -d ' ')" = 2
          test "$(grep -o 'colspan="2"' "$out/email-01-example.html" | wc -l | tr -d ' ')" = 1

      - name: Install smoke test
        run: |
          set -euo pipefail

          ./scripts/install-skill.sh --list | grep -Fx "youtube-carplay-chapter-album"
          ./scripts/install-skill.sh --list | grep -Fx "personal-shopper"
          ./bootstrap.sh --help > /dev/null

          tmp_dir="$(mktemp -d)"
          codex_dir="$tmp_dir/codex-skills"
          claude_dir="$tmp_dir/claude-skills"

          ./scripts/install-skill.sh --all --agent both --codex-dir "$codex_dir" --claude-dir "$claude_dir"

          test -f "$codex_dir/youtube-carplay-chapter-album/SKILL.md"
          test -f "$claude_dir/youtube-carplay-chapter-album/SKILL.md"
          test -f "$codex_dir/personal-shopper/SKILL.md"
          test -f "$claude_dir/personal-shopper/SKILL.md"
